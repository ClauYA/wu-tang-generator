<!DOCTYPE html>
<html lang="en">
	<head>
    	<meta charset="utf-8">
    
		<title>Wu Tang</title>
		<link rel="stylesheet" href="css/normalize.css">
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>
		<header>
			<nav>
				<h1>WU TANG</h1>
			</nav>
			<p>Five questions. One unpredictable alias.</p>
		</header>
		<main>
			<section class="container">
				<label for="name">What is your energy? </label>
				<section class="container-question">
					<section class="container-options">
						<input type="radio" name="name1" id="creative" value="a" class="choices" required />
						<label for="creative">Creative</label>
					</section>
					<section class="container-options">
						<input type="radio" name="name1" id="calm" value="b" class="choices" required />
						<label for="calm">Calm</label>
					</section>
					<section class="container-options">
						<input type="radio" name="name1" id="name" value="c" class="choices" required />
						<label for="fearless">Fearless</label>
					</section>
				</section>
				<label for="name">What is your favorite color?</label>
				<section class="container-question">
					<section class="container-options">
						<input type="radio" name="name2" id="red" value="a" class="choices" required />
						<label for="red">Red</label>
					</section>
					<section class="container-options">
						<input type="radio" name="name2" id="purple" value="b" class="choices" required />
						<label for="purple">Purple</label>
					</section>
					<section class="container-options">
						<input type="radio" name="name2" id="blue" value="c" class="choices" required />
						<label for="blue">Blue</label>
					</section>
				</section>
				
				<label for="name">What is your straight?</label>
				<section class="container-question">
					<section class="container-options">
						<input type="radio" name="name3" id="patience" value="a" class="choices" required />
						<label for="patience">Patient</label>
					</section>
					<section class="container-options">
						<input type="radio" name="name3" id="emphatic" value="b" class="choices" required />
						<label for="emphatic">Emphatic</label>
					</section>
					<section class="container-options">
						<input type="radio" name="name3" id="good-listener" value="c" class="choices" required />
						<label for="good-listener">Good Listener</label>
					</section>
				</section>
				<label for="name">What is your favor station?</label>
				<section class="container-question">
					<section class="container-options">
						<input type="radio" name="name4" id="winter" value="a" class="choices" required />
						<label for="winter">Winter</label>
					</section>
					<section class="container-options">
						<input type="radio" name="name4" id="summer" value="b" class="choices" required />
					<label for="summer">Summer</label>
					</section>
					<section class="container-options">
						<input type="radio" name="name4" id="fall" value="c" class="choices" required />
					<label for="fall">Fall</label>
					</section>
				</section>
				<label for="name">What is your favorite food?</label>
				<section class="container-question">
					<section class="container-options">
						<input type="radio" name="name5" id="breakfast" value="a" class="choices" required />
					<label for="breakfast">Breakfast</label>
					</section>
					<section class="container-options">
						<input type="radio" name="name5" id="lunch" value="b" class="choices" required />
					<label for="lunch">Lunch</label>
					</section>
					<section class="container-options">
						<input type="radio" name="name5" id="dinner" value="c" class="choices" required />
						<label for="dinner">Dinner</label>
					</section>
				</section>
				<button type="button" class="send">Wu Tang</button>
			</section>
			<section class="result">
					<h3 id="message"></h3>
			</section>
		</main>
		<script type="text/javascript" src="js/main.js"></script>
	</body>
</html>
